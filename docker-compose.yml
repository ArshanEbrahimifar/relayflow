services:
  postgres:
    image: postgres:17-alpine
    container_name: relayflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: relayflow
      POSTGRES_PASSWORD: relayflow
      POSTGRES_DB: relayflow

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relayflow -d relayflow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relayflow-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    volumes:
      - redis_data:/data

    command: ['redis-server', '--appendonly', 'yes']

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    ports:
      - '16686:16686'
      - '4318:4318'

volumes:
  postgres_data:
  redis_data:
